<style>
/* Layout: one calm column of bands; the hero pairs the promise with a live phone demo of the single orange button. Content comes from per-language dictionaries, routed by hash (#de, #de-terms…). */
:root {
  --paper: #ffffff;
  --paper-2: #f4f4f1;
  --ink: #111113;
  --ink-2: #4a4a4f;
  --muted: #6c6c70;
  --line: #e4e4e0;
  --orange: #ff6b12;
  --orange-text: #bf4800;
  --orange-soft: #fff1e8;
  --phone: #111113;
  --phone-fg: #ffffff;
  --phone-muted: #9a9aa0;
  --phone-card: #1d1d20;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  --radius: 18px;
  --max: 1120px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b0b0c; --paper-2: #161618; --ink: #f5f5f3; --ink-2: #c9c9c6; --muted: #9a9aa0; --line: #2a2a2d;
    --orange-text: #ff8a3d; --orange-soft: #2a1608; --phone: #000000; --phone-card: #1c1c1e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0b0b0c; --paper-2: #161618; --ink: #f5f5f3; --ink-2: #c9c9c6; --muted: #9a9aa0; --line: #2a2a2d;
  --orange-text: #ff8a3d; --orange-soft: #2a1608; --phone: #000000; --phone-card: #1c1c1e; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: var(--max); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; text-wrap: balance; margin: 0; hyphens: auto; }
h2 { font-size: clamp(30px, 5vw, 52px); }
h3 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
p { margin: 0; }
.eyebrow { font-family: var(--body); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--orange-text); }
.lede { font-size: 19px; color: var(--ink-2); max-width: 34em; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
.mark { width: 34px; height: 34px; border-radius: 9px; background: #111113; display: grid; place-items: center; flex: none; }
.mark svg { width: 18px; height: 18px; }
.nav { display: flex; gap: 14px; align-items: center; font-size: 15px; }
.nav .links { display: flex; gap: 22px; margin-right: 6px; }
.nav .links a { text-decoration: none; color: var(--ink-2); }
.nav .links a:hover { color: var(--ink); }
.lang { position: relative; }
.lang select { appearance: none; -webkit-appearance: none; font: 700 14px var(--body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 8px 28px 8px 11px; cursor: pointer; }
.lang::after { content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.lang option { color: #111113; background: #ffffff; }
@media (max-width: 980px) { .nav .links { display: none; } }
@media (max-width: 400px) { .nav .dl { display: none; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--body); font-weight: 700; font-size: 16px; text-decoration: none; border-radius: 14px; padding: 13px 20px; border: 0; cursor: pointer; transition: transform .15s ease; text-align: center; }
.btn:hover { transform: translateY(-1px); }
.btn-dark { background: var(--ink); color: var(--paper); }
.btn-ghost { background: var(--paper-2); color: var(--ink); }
.btn-small { padding: 9px 14px; font-size: 14px; border-radius: 11px; }
.btn svg { width: 20px; height: 20px; flex: none; }

/* Hero */
.hero .wrap { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 56px; align-items: center; padding-block: 72px 80px; }
.hero h1 { font-size: clamp(42px, 7vw, 84px); }
.hero h1 em { font-style: normal; color: var(--orange-text); }
.hero .copy { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.fine { font-size: 14px; color: var(--muted); }
@media (max-width: 880px) { .hero .wrap { grid-template-columns: 1fr; gap: 40px; padding-block: 44px 56px; } }

/* Phone demo */
.stage { display: flex; justify-content: center; }
.phone { width: min(330px, 100%); aspect-ratio: 9 / 19; background: var(--phone); border-radius: 46px; padding: 14px; box-shadow: 0 0 0 10px #1f1f22, 0 30px 70px rgba(0,0,0,.22); position: relative; color: var(--phone-fg); }
.screen { height: 100%; border-radius: 34px; background: var(--phone); display: flex; flex-direction: column; padding: 22px 18px 18px; overflow: hidden; }
.screen-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-weight: 800; font-size: 18px; }
.rec { display: inline-flex; align-items: center; gap: 6px; font-family: var(--body); font-size: 13px; color: var(--phone-muted); opacity: 0; transition: opacity .2s; }
.rec::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
.phone.listening .rec { opacity: 1; }
.said { min-height: 96px; margin-top: 26px; font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.25; text-align: center; }
.caret { display: inline-block; width: 2px; height: 1em; background: var(--orange); vertical-align: -0.12em; margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.mic-area { flex: 1; display: grid; place-items: center; }
.mic { width: 132px; height: 132px; border-radius: 50%; border: 0; background: #ffffff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 0 0 22px rgba(255,255,255,.06), 0 0 0 44px rgba(255,255,255,.03); transition: background .2s, box-shadow .3s; }
.mic svg { width: 48px; height: 48px; }
.mic svg * { stroke: #111113; transition: stroke .2s; }
.phone.listening .mic { background: var(--orange); box-shadow: 0 0 0 22px rgba(255,107,18,.18), 0 0 0 44px rgba(255,107,18,.08); }
.phone.listening .mic svg * { stroke: #ffffff; }
.card { background: var(--phone-card); border-radius: 20px; padding: 14px; display: grid; gap: 8px; transform: translateY(8px); opacity: 0; transition: opacity .3s, transform .3s; }
.phone.done .card { opacity: 1; transform: none; }
.field { background: rgba(255,255,255,.06); border-radius: 12px; padding: 8px 12px; }
.field small { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--phone-muted); font-weight: 700; }
.field span { font-size: 15px; font-weight: 700; }
.hint { text-align: center; font-size: 13px; color: var(--muted); margin-top: 22px; }
.demo-steps { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
.demo-steps i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: width .2s, background .2s; }
.demo-steps i.on { width: 18px; background: var(--orange); }

/* Bands */
.band { padding-block: 88px; }
.band.alt { background: var(--paper-2); }
.band-head { display: flex; flex-direction: column; gap: 14px; margin-bottom: 44px; max-width: 46em; }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; list-style: none; padding: 0; margin: 0; counter-reset: s; }
.steps li { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: flex; flex-direction: column; gap: 12px; counter-increment: s; min-width: 0; }
.steps li::before { content: counter(s); font-family: var(--display); font-weight: 800; font-size: 15px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--orange-soft); color: var(--orange-text); }
.quote { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.3; }
.steps p { color: var(--ink-2); }
@media (max-width: 820px) { .steps { grid-template-columns: 1fr; } }
.phrases { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.phrases span { background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 15px; color: var(--ink-2); }

.house { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
.house .copy { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.members { background: var(--paper); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
.member { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
.member + .member { border-top: 1px solid var(--line); }
.av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #111113; flex: none; }
.member div { flex: 1; min-width: 0; }
.member strong { display: block; }
.member small { color: var(--muted); font-size: 14px; }
.role { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 9px; background: var(--paper-2); }
.role.kid { background: var(--orange-soft); color: var(--orange-text); }
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.checks li { display: flex; gap: 10px; align-items: baseline; color: var(--ink-2); }
.checks li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); transform: translateY(-1px); }
@media (max-width: 860px) { .house { grid-template-columns: 1fr; } }

.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.feature { background: var(--paper); padding: 26px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.feature p { color: var(--ink-2); font-size: 16px; }
@media (max-width: 860px) { .features { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .features { grid-template-columns: 1fr; } }

.privacy { background: #111113; color: #f5f5f3; border-radius: 28px; padding: clamp(28px, 5vw, 56px); display: grid; grid-template-columns: 1.2fr 1fr; gap: 36px; align-items: center; }
.privacy > div { display: flex; flex-direction: column; gap: 16px; }
.privacy h2 { color: #ffffff; }
.privacy p { color: #c9c9c6; }
.privacy .eyebrow { color: #ff8a3d; }
.privacy ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.privacy li { padding: 14px 16px; border-radius: 14px; background: #1d1d20; color: #e8e8e5; }
@media (max-width: 820px) { .privacy { grid-template-columns: 1fr; } }

.toggle { display: inline-flex; flex-wrap: wrap; background: var(--paper); border-radius: 12px; padding: 4px; margin-top: 8px; align-self: flex-start; }
.toggle button { font: 700 15px var(--body); color: var(--muted); background: transparent; border: 0; border-radius: 9px; padding: 9px 16px; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: stretch; }
.plan { background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.plan.best { border: 2px solid var(--orange); }
.plan-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 9px; background: var(--orange); color: #111113; }
.price { font-family: var(--display); font-weight: 800; font-size: 44px; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.price small { font-family: var(--body); font-weight: 400; font-size: 16px; color: var(--muted); letter-spacing: 0; }
.per { font-size: 14px; color: var(--muted); min-height: 1.4em; margin-top: 6px; }
.plan .checks { flex: 1; }
.trial { margin-top: 22px; text-align: center; color: var(--ink-2); }
@media (max-width: 900px) { .plans { grid-template-columns: 1fr; } }

.faq { display: grid; gap: 10px; max-width: 760px; }
.faq details { border: 1px solid var(--line); border-radius: 16px; padding: 4px 20px; background: var(--paper); }
.faq summary { cursor: pointer; list-style: none; font-weight: 700; padding: 14px 0; display: flex; justify-content: space-between; gap: 16px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-family: var(--display); font-size: 22px; line-height: 1; color: var(--orange-text); }
.faq details[open] summary::after { content: "–"; }
.faq details p { padding-bottom: 16px; color: var(--ink-2); }

.final { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.final h2 { font-size: clamp(34px, 6vw, 64px); }
footer { border-top: 1px solid var(--line); }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 18px; padding-block: 32px; font-size: 14px; color: var(--muted); }
footer nav { display: flex; flex-wrap: wrap; gap: 18px; }
footer a { color: var(--ink-2); }

.legal { padding-block: 48px 80px; }
.legal .wrap { max-width: 780px; }
.legal h1 { font-size: clamp(32px, 5vw, 48px); margin: 14px 0 6px; }
.legal h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 36px 0 10px; }
.legal p, .legal li { color: var(--ink-2); }
.legal p + p { margin-top: 10px; }
.legal ul { padding-left: 20px; margin: 10px 0; display: grid; gap: 6px; }
.legal .meta { color: var(--muted); font-size: 15px; }
.draft { margin-top: 18px; background: var(--orange-soft); color: var(--ink); border-radius: 14px; padding: 14px 16px; font-size: 15px; }
.back { font-size: 15px; color: var(--orange-text); text-decoration: none; font-weight: 700; }
.fill { background: var(--paper-2); border-radius: 6px; padding: 0 5px; color: var(--ink); font-weight: 700; }
.tbl { overflow-x: auto; margin: 14px 0; }
.tbl table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 15px; }
.tbl th, .tbl td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { color: var(--ink); }
.tbl td { color: var(--ink-2); }
</style>

</head>

<header class="top">
  <div class="wrap">

<main id="app"></main>

<footer>
  <div class="wrap" id="foot"></div>

<script>

<p>Nouk uses an artificial intelligence model to identify the item and the place in your sentences. This processing can make mistakes: a confirmation card lets you correct it before saving. Nouk does not guarantee the accuracy of answers, which depend on what members have recorded.</p>

      terms: { short: 'Nutzungsbedingungen', title: 'Allgemeine Nutzungsbedingungen', html: `
<h2>1. Gegenstand</h2>

      terms: { short: 'Condizioni d’uso', title: 'Condizioni generali d’uso', html: `
<h2>1. Oggetto</h2>
<p>Le presenti condizioni regolano l'uso dell'app Nouk, che permette di registrare, a voce o per iscritto, dove sono riposti gli oggetti e poi ritrovarli, da soli o all'interno di una famiglia. Creando un account, accetti queste condizioni.</p>
<h2>2. Accesso al servizio</h2>
<p>Nouk è disponibile su iPhone. L'account si crea con «Accedi con Apple» o via e-mail con un codice di verifica. Devi fornire informazioni corrette e mantenere riservato l'accesso al tuo account.</p>
<p>Un account può essere connesso su un solo iPhone alla volta. Un nuovo accesso da un altro dispositivo disconnette automaticamente il precedente.</p>
<h2>3. La famiglia</h2>
<p>Una famiglia riunisce fino a 6 persone che condividono la stessa memoria degli oggetti. Il titolare della famiglia sottoscrive l'abbonamento Famiglia e invita gli altri membri tramite link o codice QR.</p>
<ul>
<li><strong>Titolare</strong>: tutti i permessi, compresa la gestione dell'abbonamento.</li>
<li><strong>Adulto</strong>: gli stessi permessi del titolare, tranne la gestione dell'abbonamento.</li>
<li><strong>Bambino</strong>: può cercare e mettere via, ma non eliminare né gestire la famiglia.</li>
</ul>
<p>I contenuti aggiunti alla famiglia sono visibili a tutti i membri. Un membro rimosso dalla famiglia perde subito l'accesso; gli oggetti che ha messo via restano nella memoria della famiglia.</p>
<p>L'uso da parte di un minore di 15 anni avviene sotto la responsabilità e con il consenso di un titolare della responsabilità genitoriale, membro adulto della famiglia.</p>
<h2>4. I tuoi contenuti</h2>
<p>Gli oggetti, i posti, le foto e le cronologie che registri ti appartengono. Autorizzi l'editore a ospitarli e trattarli unicamente per far funzionare il servizio. Puoi esportarli o eliminarli in qualsiasi momento.</p>
<h2>5. Intelligenza artificiale</h2>
<p>Nouk utilizza un modello di intelligenza artificiale per identificare l'oggetto e il posto nelle tue frasi. Questo trattamento può sbagliare: una scheda di verifica ti permette di correggere prima di salvare. Nouk non garantisce l'esattezza delle risposte, che dipendono da ciò che i membri hanno registrato.</p>
<h2>6. Uso consentito</h2>
<p>Ti impegni a non usare Nouk per archiviare contenuti illeciti, a non tentare di aggirare i limiti del servizio (in particolare l'accesso su un solo dispositivo) e a non disturbarne il funzionamento. Un limite tecnico di 300 frasi al giorno protegge il servizio dagli usi automatizzati.</p>
<h2>7. Responsabilità</h2>
<p>Nouk è un promemoria. Non costituisce un inventario certificato e non deve essere usato come prova nei confronti di un assicuratore. L'editore fa il possibile per garantire la disponibilità del servizio, senza poter garantire l'assenza totale di interruzioni.</p>
<h2>8. Sospensione e chiusura dell'account</h2>
<p>Puoi eliminare il tuo account in qualsiasi momento dalle impostazioni dell'app. L'editore può sospendere un account in caso di grave violazione delle presenti condizioni, dopo averti informato salvo urgenza.</p>
<h2>9. Modifiche</h2>
<p>Queste condizioni possono cambiare. Sarai informato nell'app di ogni modifica importante prima della sua entrata in vigore.</p>
<h2>10. Legge applicabile</h2>
<p>Le presenti condizioni sono regolate dal diritto francese, senza privarti della tutela garantita dalle norme imperative del tuo paese di residenza. In caso di controversia, si cercherà prima una soluzione amichevole, in particolare tramite il mediatore indicato nelle <a href="#notice">note legali</a>.</p>` },
      sale: { short: 'Condizioni di vendita', title: 'Condizioni generali di vendita', html: `
<h2>1. Offerte e prezzi</h2>

<p>I prezzi si intendono comprensivi di tutte le imposte. Possono variare in base al paese del tuo account App Store.</p>
<h2>2. Pagamento</h2>
<p>Tutti gli acquisti avvengono tramite l'App Store di Apple, con il metodo di pagamento associato al tuo Account Apple. L'editore non ha mai accesso ai tuoi dati bancari.</p>
<h2>3. Prova gratuita</h2>
<p>La prova dà accesso a tutte le funzioni per 14 giorni. Senza abbonamento alla scadenza, l'accesso diventa di sola consultazione. Se scegli un'offerta durante la prova, il primo addebito avviene alla fine della prova, salvo disdetta almeno 24 ore prima.</p>
<h2>4. Rinnovo e disdetta</h2>
<p>Gli abbonamenti Solo e Famiglia si rinnovano automaticamente a ogni scadenza, salvo disdetta almeno 24 ore prima della fine del periodo in corso, da Impostazioni, poi il tuo nome, poi Abbonamenti. La disdetta ha effetto alla fine del periodo già pagato.</p>
<h2>5. Pass Trasloco</h2>
<p>Il Pass Trasloco è un acquisto unico, valido 60 giorni dall'acquisto, senza rinnovo. Può essere acquistato una volta ogni 12 mesi, per account e per famiglia. Alla scadenza, la memoria resta consultabile in sola lettura; per aggiungere oggetti o chiedere a Nouk a voce, serve un abbonamento Solo o Famiglia.</p>
<h2>6. Diritto di recesso</h2>
<p>Il servizio è un contenuto digitale fornito subito dopo l'acquisto. Confermando l'acquisto, chiedi l'esecuzione immediata e riconosci di rinunciare al diritto di recesso di 14 giorni, ai sensi dell'articolo L221-28 del Codice del consumo francese (art. 16, lettera m, della Direttiva 2011/83/UE). Le richieste di rimborso sono gestite da Apple su reportaproblem.apple.com.</p>
<h2>7. Variazioni di prezzo</h2>
<p>In caso di aumento di prezzo, Apple e l'app ti avviseranno prima che si applichi, con la possibilità di disdire.</p>
<h2>8. Reclami</h2>
<p>Per qualsiasi domanda: support@getnouk.app. Mediazione dei consumatori: vedi le <a href="#notice">note legali</a>.</p>` },
      privacy: { short: 'Privacy', title: 'Informativa sulla privacy', html: `
<h2>1. Titolare del trattamento</h2>
<p>JFB Design, impresa individuale, editore di Nouk. Contatto per i tuoi dati: contact@getnouk.app.</p>
<h2>2. La tua voce</h2>
<p>La trascrizione della tua voce avviene sul tuo iPhone tramite il riconoscimento vocale di Apple. Nessuna registrazione audio viene inviata ai nostri server né conservata da Nouk.</p>
<h2>3. Dati raccolti</h2>
<div class="tbl"><table>
<thead><tr><th>Dati</th><th>Perché</th><th>Base giuridica</th></tr></thead>
<tbody>
<tr><td>Account: nome, indirizzo e-mail (o indirizzo di inoltro Apple)</td><td>Creare e proteggere il tuo account</td><td>Esecuzione del contratto</td></tr>
<tr><td>Contenuti: oggetti, posti, foto, cronologia, prestiti</td><td>Far funzionare il servizio e condividerlo con la tua famiglia</td><td>Esecuzione del contratto</td></tr>
<tr><td>Testo delle frasi dettate o scritte</td><td>Identificare l'oggetto e il posto</td><td>Esecuzione del contratto</td></tr>
<tr><td>Famiglia: membri, ruoli, inviti</td><td>Gestire la condivisione e i permessi</td><td>Esecuzione del contratto</td></tr>
<tr><td>Dispositivo attivo, token di notifica</td><td>Una sola sessione per account, inviare promemoria</td><td>Legittimo interesse; consenso per le notifiche</td></tr>
<tr><td>Stato dell'abbonamento (senza dati bancari)</td><td>Dare accesso alla tua offerta</td><td>Esecuzione del contratto</td></tr>
<tr><td>Statistiche anonime, se le attivi</td><td>Migliorare l'app</td><td>Consenso</td></tr>
</tbody>
</table></div>
<p>Nouk non mostra pubblicità e non vende dati.</p>
<h2>4. Chi riceve i tuoi dati</h2>
<ul>
<li><strong>I membri della tua famiglia</strong>, per i contenuti condivisi.</li>
<li><strong>Supabase</strong>: hosting del database, nell'Unione europea.</li>
<li><strong>Anthropic</strong>: analisi del testo delle tue frasi tramite il modello Claude, per identificare l'oggetto e il posto. Questo fornitore può trattare dati al di fuori dell'Unione europea, con garanzie contrattuali (clausole contrattuali tipo).</li>
<li><strong>Apple</strong>: accesso con Apple, pagamenti e notifiche.</li>
<li><strong>Brevo</strong>: invio delle e-mail di accesso (codice a 6 cifre), dall'Unione europea.</li>
<li><strong>GitHub</strong>: hosting del sito getnouk.app e delle pagine di invito, che non raccolgono alcun dato personale.</li>
</ul>
<h2>5. Conservazione</h2>
<p>I tuoi dati sono conservati finché il tuo account è attivo. Dopo l'eliminazione dell'account, vengono cancellati entro 30 giorni al massimo, backup compresi. Se sei titolare di una famiglia e la elimini, i suoi contenuti vengono cancellati per tutti i membri, a meno che tu non trasferisca la famiglia a un altro adulto.</p>
<h2>6. I tuoi diritti</h2>
<p>Puoi accedere ai tuoi dati, rettificarli, esportarli (in Impostazioni, poi Privacy e dati), eliminarli, opporti a certi trattamenti o revocare il consenso. Scrivi a contact@getnouk.app. Puoi anche presentare reclamo alla CNIL (cnil.fr), l'autorità francese per la protezione dei dati, o all'autorità del tuo paese (in Italia, il Garante per la protezione dei dati personali).</p>
<h2>7. Minori</h2>
<p>Gli account per bambini vengono creati su invito di un adulto della famiglia. Al di sotto dell'età fissata nel tuo paese (15 anni in Francia, 14 in Italia) è richiesto il consenso di un titolare della responsabilità genitoriale.</p>
<h2>8. Sicurezza</h2>
<p>Le comunicazioni sono cifrate, l'accesso ai dati è limitato per famiglia e per ruolo, e un account può essere aperto su un solo iPhone alla volta.</p>
<h2>9. Questo sito</h2>
<p>Questo sito non utilizza cookie pubblicitari né strumenti di misurazione dell'audience.</p>` }

      terms: { short: 'Gebruiksvoorwaarden', title: 'Algemene gebruiksvoorwaarden', html: `
<h2>1. Onderwerp</h2>
<p>Deze voorwaarden regelen het gebruik van de app Nouk, waarmee je met je stem of schriftelijk vastlegt waar voorwerpen zijn opgeborgen, om ze daarna terug te vinden, alleen of binnen een huishouden. Door een account aan te maken, aanvaard je deze voorwaarden.</p>
<h2>2. Toegang tot de dienst</h2>
<p>Nouk is beschikbaar op de iPhone. Je maakt een account aan met ‘Log in met Apple’ of per e-mail met een verificatiecode. Je moet juiste gegevens opgeven en de toegang tot je account vertrouwelijk houden.</p>
<p>Een account kan op één iPhone tegelijk ingelogd zijn. Inloggen op een ander apparaat logt het vorige automatisch uit.</p>
<h2>3. Het huishouden</h2>
<p>Een huishouden brengt tot 6 personen samen die hetzelfde geheugen van voorwerpen delen. De eigenaar van het huishouden neemt het Huishouden-abonnement en nodigt de andere leden uit via link of QR-code.</p>
<ul>
<li><strong>Eigenaar</strong>: alle rechten, inclusief het beheer van het abonnement.</li>
<li><strong>Volwassene</strong>: dezelfde rechten als de eigenaar, behalve het beheer van het abonnement.</li>
<li><strong>Kind</strong>: kan zoeken en opbergen, maar niet verwijderen of het huishouden beheren.</li>
</ul>
<p>Inhoud in het huishouden is zichtbaar voor alle leden. Een lid dat uit het huishouden wordt verwijderd, verliest direct de toegang; de voorwerpen die het heeft opgeborgen blijven in het geheugen van het huishouden.</p>
<p>Gebruik door een minderjarige jonger dan 15 jaar gebeurt onder verantwoordelijkheid en met toestemming van een ouder of voogd die volwassen lid van het huishouden is.</p>
<h2>4. Jouw inhoud</h2>
<p>De voorwerpen, plekken, foto's en geschiedenis die je vastlegt, zijn van jou. Je geeft de uitgever toestemming ze uitsluitend op te slaan en te verwerken om de dienst te laten werken. Je kunt ze op elk moment exporteren of verwijderen.</p>
<h2>5. Kunstmatige intelligentie</h2>
<p>Nouk gebruikt een AI-model om het voorwerp en de plek in je zinnen te herkennen. Die verwerking kan zich vergissen: met een controlekaart kun je corrigeren voordat je opslaat. Nouk garandeert niet dat de antwoorden juist zijn; ze hangen af van wat de leden hebben vastgelegd.</p>
<h2>6. Aanvaardbaar gebruik</h2>
<p>Je verbindt je ertoe Nouk niet te gebruiken om onrechtmatige inhoud op te slaan, de grenzen van de dienst niet te omzeilen (met name het inloggen op één apparaat) en de werking ervan niet te verstoren. Een technische limiet van 300 zinnen per dag beschermt de dienst tegen geautomatiseerd gebruik.</p>
<h2>7. Aansprakelijkheid</h2>
<p>Nouk is een geheugensteun. Het is geen gecertificeerde inventaris en mag niet als bewijs tegenover een verzekeraar dienen. De uitgever doet zijn best om de dienst beschikbaar te houden, maar kan niet garanderen dat die nooit onderbroken wordt.</p>
<h2>8. Opschorting en sluiting van het account</h2>
<p>Je kunt je account op elk moment verwijderen in de instellingen van de app. De uitgever kan een account opschorten bij een ernstige schending van deze voorwaarden, na je te hebben geïnformeerd, behalve in spoedgevallen.</p>
<h2>9. Wijzigingen</h2>
<p>Deze voorwaarden kunnen veranderen. Over belangrijke wijzigingen word je in de app geïnformeerd voordat ze ingaan.</p>
<h2>10. Toepasselijk recht</h2>
<p>Op deze voorwaarden is Frans recht van toepassing, zonder dat je de bescherming verliest van de dwingende regels van je woonland. Bij een geschil wordt eerst een minnelijke oplossing gezocht, met name via de bemiddelaar in het <a href="#notice">colofon</a>.</p>` },

      privacy: { short: 'Privacy', title: 'Privacybeleid', html: `

    if (box) demo(box, d.demos);
  }

  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  var timer = null;
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function demo(box, list) {
    clearInterval(timer);
    var phone = box.querySelector('.phone'), said = box.querySelector('.said');
    var dots = box.querySelectorAll('.demo-steps i');
    var i = 0, busy = false;
    function q(c) { return box.querySelector(c); }
    phone.classList.add('done');
    function setCard(x) {
      q('.k1').textContent = x.k1; q('.v1').textContent = x.v1;
      q('.k2').textContent = x.k2; q('.v2').textContent = x.v2;
      q('.rec').textContent = x.t;
      dots.forEach(function (dot, n) { dot.classList.toggle('on', n === i); });
    }
    q('.mic').addEventListener('click', function () {
      if (busy) return; busy = true;
      i = (i + 1) % list.length; var x = list[i];
      phone.classList.remove('done'); setCard(x);
      if (reduce) { said.textContent = x.said; phone.classList.add('done'); busy = false; return; }
      phone.classList.add('listening');
      var n = 0; said.innerHTML = '<span class="caret"></span>';
      timer = setInterval(function () {
        n += 2;
        said.innerHTML = esc(x.said.slice(0, n)) + '<span class="caret"></span>';
        if (n >= x.said.length) {
          clearInterval(timer);
          setTimeout(function () { said.textContent = x.said; phone.classList.remove('listening'); phone.classList.add('done'); busy = false; }, 450);
        }
      }, 45);
    });
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>

</body>
</html>
